<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>What's for Dinner?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1a0533 0%,#0d1b4b 50%,#0a2a1a 100%);min-height:100vh;color:#fff;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:2px}
.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;backdrop-filter:blur(10px)}
.btn{cursor:pointer;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;transition:all 0.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:translateY(0)}
input,select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:white;font-family:'Nunito',sans-serif;font-size:15px;padding:10px 14px;outline:none;width:100%}
input::placeholder{color:rgba(255,255,255,0.4)}
input:focus{border-color:rgba(255,209,102,0.6);background:rgba(255,255,255,0.15)}
select option{background:#1a0533;color:white}
.nav-btn{cursor:pointer;border:none;background:none;font-family:'Nunito',sans-serif;transition:all 0.2s;border-radius:14px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-btn.active{background:rgba(255,255,255,0.15)}
.day-card{cursor:pointer;border-radius:20px;padding:14px;transition:all 0.2s;border:2px solid transparent}
.day-card:hover{transform:translateY(-2px)}
.day-card.active{border-color:#FFD166!important;box-shadow:0 0 20px rgba(255,209,102,0.4)}
.meal-pill{cursor:pointer;border-radius:16px;padding:12px 16px;transition:all 0.2s;border:2px solid transparent}
.meal-pill:hover{transform:scale(1.02);border-color:rgba(255,255,255,0.3)}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.pop-in{animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:0.6}}
.shimmer{animation:shimmer 2s infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEALS=[
  {name:"Spaghetti Bolognese",emoji:"🍝",tags:["pasta","beef"],time:"45 min"},
  {name:"Tacos",emoji:"🌮",tags:["mexican","beef"],time:"30 min"},
  {name:"Grilled Chicken",emoji:"🍗",tags:["chicken","healthy"],time:"35 min"},
  {name:"Pizza Night",emoji:"🍕",tags:["italian","fun"],time:"25 min"},
  {name:"Stir Fry",emoji:"🥢",tags:["asian","veggies"],time:"20 min"},
  {name:"Burgers",emoji:"🍔",tags:["beef","fun"],time:"30 min"},
  {name:"Salmon",emoji:"🐟",tags:["fish","healthy"],time:"25 min"},
  {name:"Mac & Cheese",emoji:"🧀",tags:["pasta","kids"],time:"20 min"},
  {name:"BBQ Ribs",emoji:"🥩",tags:["beef","bbq"],time:"2 hrs"},
  {name:"Veggie Curry",emoji:"🍛",tags:["indian","veggie"],time:"40 min"},
  {name:"Hot Dogs",emoji:"🌭",tags:["fun","kids"],time:"15 min"},
  {name:"Fried Rice",emoji:"🍚",tags:["asian","rice"],time:"25 min"},
  {name:"Chicken Soup",emoji:"🍲",tags:["soup","chicken"],time:"1 hr"},
  {name:"Fish & Chips",emoji:"🐠",tags:["fish","fried"],time:"45 min"},
  {name:"Lasagna",emoji:"🫕",tags:["pasta","beef"],time:"1.5 hrs"},
  {name:"Poke Bowl",emoji:"🥗",tags:["fish","healthy"],time:"20 min"},
];
const FAMILY=[
  {name:"Dad",emoji:"👨",color:"#FF6B35"},
  {name:"Mom",emoji:"👩",color:"#E91E8C"},
  {name:"Kid 1",emoji:"🧒",color:"#00C2FF"},
  {name:"Kid 2",emoji:"👧",color:"#7B2FBE"},
];
const COLORS=["#FF6B35","#E91E8C","#00C2FF","#7B2FBE","#FFD166","#06D6A0","#EF476F","#118AB2"];
const initWeek=()=>DAYS.reduce((a,d)=>({...a,[d]:null}),{});

function App(){
  const [view,setView]=React.useState("planner");
  const [week,setWeek]=React.useState(initWeek());
  const [activeDay,setActiveDay]=React.useState(null);
  const [suggestions,setSuggestions]=React.useState([]);
  const [history]=React.useState([
    {name:"Tacos",emoji:"🌮",date:"Last Monday",rating:5,votes:["Dad","Kid 1"]},
    {name:"Pizza Night",emoji:"🍕",date:"Last Friday",rating:4,votes:["Mom","Kid 1","Kid 2"]},
    {name:"Stir Fry",emoji:"🥢",date:"Two weeks ago",rating:3,votes:["Mom"]},
  ]);
  const [shopping,setShopping]=React.useState([
    {item:"Chicken breast",checked:false},
    {item:"Pasta",checked:false},
    {item:"Tomatoes",checked:true},
    {item:"Cheese",checked:false},
  ]);
  const [newItem,setNewItem]=React.useState("");
  const [suggestion,setSuggestion]=React.useState("");
  const [suggBy,setSuggBy]=React.useState("Dad");
  const [pending,setPending]=React.useState([
    {meal:"Burgers",emoji:"🍔",by:"Kid 1",votes:2},
    {meal:"Pizza Night",emoji:"🍕",by:"Kid 2",votes:3},
  ]);

  const shuffle=()=>setSuggestions([...MEALS].sort(()=>Math.random()-0.5).slice(0,4));
  React.useEffect(()=>{shuffle();},[]);

  const assignMeal=(meal)=>{
    if(!activeDay)return;
    setWeek(w=>({...w,[activeDay]:meal}));
    setActiveDay(null);
  };

  const addItem=()=>{
    if(!newItem.trim())return;
    setShopping(s=>[...s,{item:newItem.trim(),checked:false}]);
    setNewItem("");
  };

  const submitSugg=()=>{
    if(!suggestion.trim())return;
    const m=MEALS.find(x=>x.name.toLowerCase().includes(suggestion.toLowerCase()));
    setPending(p=>[...p,{meal:suggestion,emoji:m?.emoji||"🍽️",by:suggBy,votes:1}]);
    setSuggestion("");
  };

  const done=shopping.filter(i=>i.checked).length;

  return(
    <div style={{minHeight:"100vh",paddingBottom:80}}>
      {/* Header */}
      <div style={{padding:"24px 20px 8px",textAlign:"center"}}>
        <div style={{fontSize:36,marginBottom:4}}>🍽️</div>
        <h1 style={{fontFamily:"'Fredoka One'",fontSize:32,letterSpacing:1,background:"linear-gradient(90deg,#FFD166,#FF6B35,#E91E8C)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>What's for Dinner?</h1>
        <p style={{fontSize:13,opacity:0.6,marginTop:2}}>The family meal planner ✨</p>
      </div>

      {/* Family Row */}
      <div style={{display:"flex",justifyContent:"center",gap:12,padding:"12px 20px"}}>
        {FAMILY.map((m,i)=>(
          <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{width:44,height:44,borderRadius:"50%",background:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,border:"2px solid rgba(255,255,255,0.3)"}}>{m.emoji}</div>
            <span style={{fontSize:10,opacity:0.7,fontWeight:700}}>{m.name}</span>
          </div>
        ))}
      </div>

      {/* Content */}
      <div style={{padding:"0 16px",maxWidth:500,margin:"0 auto"}}>

        {/* PLANNER */}
        {view==="planner"&&(
          <div className="pop-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <h2 style={{fontFamily:"'Fredoka One'",fontSize:22}}>This Week</h2>
              <button className="btn" style={{background:"linear-gradient(135deg,#FFD166,#FF6B35)",color:"#1a0533",padding:"8px 16px",fontSize:13}} onClick={()=>setView("ideas")}>+ Add Meals</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {DAYS.map((day,i)=>{
                const meal=week[day];
                const isActive=activeDay===day;
                return(
                  <div key={day} className={`day-card card ${isActive?"active":""}`} onClick={()=>setActiveDay(isActive?null:day)}>
                    <div style={{display:"flex",alignItems:"center",gap:14}}>
                      <div style={{width:44,textAlign:"center"}}>
                        <div style={{fontSize:10,fontWeight:700,opacity:0.5,textTransform:"uppercase",letterSpacing:1}}>{SHORT[i]}</div>
                      </div>
                      {meal?(
                        <div style={{flex:1,display:"flex",alignItems:"center",gap:10}}>
                          <span style={{fontSize:28}}>{meal.emoji}</span>
                          <div>
                            <div style={{fontWeight:800,fontSize:16}}>{meal.name}</div>
                            <div style={{fontSize:12,opacity:0.5}}>⏱ {meal.time}</div>
                          </div>
                          <button className="btn" style={{marginLeft:"auto",background:"rgba(255,255,255,0.1)",color:"white",padding:"6px 12px",fontSize:12}} onClick={e=>{e.stopPropagation();setWeek(w=>({...w,[day]:null}));}}>✕</button>
                        </div>
                      ):(
                        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,opacity:0.4}}>
                          <span style={{fontSize:24}}>🤷</span>
                          <span style={{fontSize:14,fontStyle:"italic"}}>Tap to pick dinner</span>
                        </div>
                      )}
                    </div>
                    {isActive&&(
                      <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid rgba(255,255,255,0.1)"}}>
                        <div style={{fontSize:12,fontWeight:700,opacity:0.6,marginBottom:8}}>QUICK PICK:</div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                          {suggestions.map((s,idx)=>(
                            <button key={idx} className="btn" style={{background:`${COLORS[idx%COLORS.length]}33`,border:`1px solid ${COLORS[idx%COLORS.length]}66`,color:"white",padding:"8px 14px",fontSize:13}} onClick={()=>assignMeal(s)}>{s.emoji} {s.name}</button>
                          ))}
                          <button className="btn" style={{background:"rgba(255,255,255,0.1)",color:"white",padding:"8px 14px",fontSize:13}} onClick={shuffle}>🔀 More</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {pending.length>0&&(
              <div style={{marginTop:20}}>
                <h3 style={{fontFamily:"'Fredoka One'",fontSize:18,marginBottom:10}}>🗳️ Family Suggestions</h3>
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  {pending.map((s,i)=>(
                    <div key={i} className="card" style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                      <span style={{fontSize:26}}>{s.emoji}</span>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:800}}>{s.meal}</div>
                        <div style={{fontSize:12,opacity:0.5}}>suggested by {s.by}</div>
                      </div>
                      <button className="btn" style={{background:"rgba(255,107,53,0.3)",color:"#FF6B35",padding:"8px 14px",fontSize:14,fontWeight:800}} onClick={()=>setPending(p=>p.map((x,j)=>j===i?{...x,votes:x.votes+1}:x))}>👍 {s.votes}</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* IDEAS */}
        {view==="ideas"&&(
          <div className="pop-in">
            <h2 style={{fontFamily:"'Fredoka One'",fontSize:22,marginBottom:4}}>Dinner Ideas 💡</h2>
            <p style={{fontSize:13,opacity:0.5,marginBottom:16}}>Tap a meal to add it to the week</p>
            <div className="card" style={{padding:16,marginBottom:16}}>
              <div style={{fontWeight:800,marginBottom:10,fontSize:15}}>🙋 Make a suggestion</div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <select value={suggBy} onChange={e=>setSuggBy(e.target.value)} style={{width:100}}>
                  {FAMILY.map(m=><option key={m.name}>{m.name}</option>)}
                </select>
                <input placeholder="What do you want?" value={suggestion} onChange={e=>setSuggestion(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submitSugg()}/>
              </div>
              <button className="btn" style={{background:"linear-gradient(135deg,#E91E8C,#7B2FBE)",color:"white",padding:"10px 20px",fontSize:14,width:"100%"}} onClick={submitSugg}>Submit Suggestion 🚀</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {MEALS.map((meal,i)=>{
                const added=Object.values(week).some(m=>m?.name===meal.name);
                return(
                  <div key={i} className="meal-pill card" style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:14,opacity:added?0.4:1}} onClick={()=>{
                    if(added)return;
                    const empty=DAYS.find(d=>!week[d]);
                    if(empty)setWeek(w=>({...w,[empty]:meal}));
                  }}>
                    <span style={{fontSize:32}}>{meal.emoji}</span>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:16}}>{meal.name}</div>
                      <div style={{display:"flex",gap:6,marginTop:4}}>
                        <span style={{fontSize:12,opacity:0.5}}>⏱ {meal.time}</span>
                        {meal.tags.slice(0,2).map(tag=>(
                          <span key={tag} style={{borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,background:`${COLORS[i%COLORS.length]}33`,color:COLORS[i%COLORS.length]}}>#{tag}</span>
                        ))}
                      </div>
                    </div>
                    {added?<span style={{fontSize:12,opacity:0.5}}>✓ Added</span>:<span style={{fontSize:20}}>➕</span>}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* HISTORY */}
        {view==="history"&&(
          <div className="pop-in">
            <h2 style={{fontFamily:"'Fredoka One'",fontSize:22,marginBottom:4}}>Past Dinners 📖</h2>
            <p style={{fontSize:13,opacity:0.5,marginBottom:16}}>Your family's dinner memory</p>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {history.map((item,i)=>(
                <div key={i} className="card" style={{padding:16}}>
                  <div style={{display:"flex",alignItems:"center",gap:14}}>
                    <div style={{width:56,height:56,borderRadius:16,background:`${COLORS[i%COLORS.length]}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30}}>{item.emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800,fontSize:16}}>{item.name}</div>
                      <div style={{fontSize:12,opacity:0.5,marginTop:2}}>{item.date}</div>
                      <div style={{display:"flex",gap:2,marginTop:4}}>
                        {[...Array(5)].map((_,si)=>(
                          <span key={si} style={{color:"#FFD166",fontSize:14,opacity:si<item.rating?1:0.2}}>★</span>
                        ))}
                      </div>
                    </div>
                    <div style={{display:"flex"}}>
                      {item.votes.map((v,vi)=>{
                        const member=FAMILY.find(m=>m.name===v);
                        return member?(
                          <div key={vi} style={{width:28,height:28,borderRadius:"50%",background:member.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,marginLeft:vi>0?-8:0,border:"2px solid rgba(0,0,0,0.3)"}}>{member.emoji}</div>
                        ):null;
                      })}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* SHOPPING */}
        {view==="shopping"&&(
          <div className="pop-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <h2 style={{fontFamily:"'Fredoka One'",fontSize:22}}>Shopping List 🛒</h2>
              <span style={{fontSize:13,opacity:0.6}}>{done}/{shopping.length} done</span>
            </div>
            <div style={{height:6,background:"rgba(255,255,255,0.1)",borderRadius:3,marginBottom:16,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${shopping.length?(done/shopping.length)*100:0}%`,background:"linear-gradient(90deg,#06D6A0,#00C2FF)",borderRadius:3,transition:"width 0.4s"}}/>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <input placeholder="Add item..." value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
              <button className="btn" style={{background:"linear-gradient(135deg,#06D6A0,#00C2FF)",color:"#1a0533",padding:"10px 18px",fontSize:16,flexShrink:0}} onClick={addItem}>+</button>
            </div>
            <button className="btn" style={{background:"rgba(255,209,102,0.15)",border:"1px solid rgba(255,209,102,0.3)",color:"#FFD166",padding:"10px 16px",fontSize:13,width:"100%",marginBottom:16}} onClick={()=>{
              const meals=Object.values(week).filter(Boolean).map(m=>m.name);
              if(meals.length)setShopping(s=>[...s,...meals.map(m=>({item:`Ingredients for ${m}`,checked:false}))]);
            }}>✨ Auto-fill from this week's meals</button>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {shopping.map((item,i)=>(
                <div key={i} className="card" style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:14,cursor:"pointer",opacity:item.checked?0.45:1}} onClick={()=>setShopping(s=>s.map((x,j)=>j===i?{...x,checked:!x.checked}:x))}>
                  <div style={{width:24,height:24,borderRadius:8,border:`2px solid ${item.checked?"#06D6A0":"rgba(255,255,255,0.3)"}`,background:item.checked?"#06D6A0":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all 0.2s"}}>
                    {item.checked&&<span style={{color:"#1a0533",fontWeight:900,fontSize:14}}>✓</span>}
                  </div>
                  <span style={{flex:1,fontSize:16,fontWeight:600,textDecoration:item.checked?"line-through":"none"}}>{item.item}</span>
                  <button className="btn" style={{background:"transparent",color:"rgba(255,255,255,0.2)",padding:"4px 8px",fontSize:16}} onClick={e=>{e.stopPropagation();setShopping(s=>s.filter((_,j)=>j!==i));}}>✕</button>
                </div>
              ))}
            </div>
            {done===shopping.length&&shopping.length>0&&<div style={{textAlign:"center",padding:20,fontSize:40}} className="shimmer">🎉</div>}
          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:"rgba(15,5,35,0.95)",backdropFilter:"blur(20px)",borderTop:"1px solid rgba(255,255,255,0.1)",display:"flex",justifyContent:"space-around",padding:"8px 0 12px"}}>
        {[{id:"planner",emoji:"📅",label:"Planner"},{id:"ideas",emoji:"💡",label:"Ideas"},{id:"history",emoji:"📖",label:"History"},{id:"shopping",emoji:"🛒",label:"Shopping"}].map(tab=>(
          <button key={tab.id} className={`nav-btn ${view===tab.id?"active":""}`} style={{color:view===tab.id?"#FFD166":"rgba(255,255,255,0.5)",minWidth:70}} onClick={()=>setView(tab.id)}>
            <span style={{fontSize:22}}>{tab.emoji}</span>
            <span style={{fontSize:11,fontWeight:800}}>{tab.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
