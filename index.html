<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>What's for Dinner?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#1a0533 0%,#0d1b4b 50%,#0a2a1a 100%);min-height:100vh;color:#fff}
.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:14px;margin-bottom:10px}
.btn{cursor:pointer;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;padding:10px 18px;font-size:14px;transition:all 0.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
input,select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:white;font-family:'Nunito',sans-serif;font-size:15px;padding:10px 14px;outline:none;width:100%}
input::placeholder{color:rgba(255,255,255,0.4)}
select option{background:#1a0533}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,5,35,0.97);border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-around;padding:8px 0 14px}
.nav button{cursor:pointer;border:none;background:none;color:rgba(255,255,255,0.5);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 16px;border-radius:14px}
.nav button.active{background:rgba(255,255,255,0.15);color:#FFD166}
.nav button span.icon{font-size:22px}
#app{padding:0 16px 100px;max-width:500px;margin:0 auto}
.title{background:linear-gradient(90deg,#FFD166,#FF6B35,#E91E8C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'Fredoka One';font-size:32px;letter-spacing:1px}
.section{display:none}
.section.active{display:block}
.day-row{display:flex;align-items:center;gap:12px;cursor:pointer}
.day-label{width:40px;font-size:10px;font-weight:800;opacity:0.5;text-transform:uppercase}
.meal-name{font-weight:800;font-size:15px}
.meal-time{font-size:11px;opacity:0.5}
.quick-picks{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.check-box{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all 0.2s}
.check-box.checked{background:#06D6A0;border-color:#06D6A0;color:#1a0533;font-weight:900}
.progress-bar{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#06D6A0,#00C2FF);border-radius:3px;transition:width 0.4s}
</style>
</head>
<body>
<div style="padding:24px 20px 8px;text-align:center">
  <div style="font-size:36px;margin-bottom:4px">🍽️</div>
  <div class="title">What's for Dinner?</div>
  <p style="font-size:13px;opacity:0.6;margin-top:4px">The family meal planner ✨</p>
</div>
<div style="display:flex;justify-content:center;gap:12px;padding:12px 20px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;border-radius:50%;background:#FF6B35;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3)">👨</div><span style="font-size:10px;opacity:0.7;font-weight:700">Dad</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;border-radius:50%;background:#E91E8C;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3)">👩</div><span style="font-size:10px;opacity:0.7;font-weight:700">Mom</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;border-radius:50%;background:#00C2FF;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3)">🧒</div><span style="font-size:10px;opacity:0.7;font-weight:700">Kid 1</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;border-radius:50%;background:#7B2FBE;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,255,255,0.3)">👧</div><span style="font-size:10px;opacity:0.7;font-weight:700">Kid 2</span></div>
</div>
<div id="app">
  <!-- PLANNER -->
  <div id="planner" class="section active">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="font-family:'Fredoka One';font-size:22px">This Week</h2>
      <button class="btn" style="background:linear-gradient(135deg,#FFD166,#FF6B35);color:#1a0533" onclick="showSection('ideas')">+ Add Meals</button>
    </div>
    <div id="week-list"></div>
    <div id="suggestions-section" style="margin-top:20px;display:none">
      <h3 style="font-family:'Fredoka One';font-size:18px;margin-bottom:10px">🗳️ Family Suggestions</h3>
      <div id="suggestions-list"></div>
    </div>
  </div>

  <!-- IDEAS -->
  <div id="ideas" class="section">
    <h2 style="font-family:'Fredoka One';font-size:22px;margin-bottom:4px">Dinner Ideas 💡</h2>
    <p style="font-size:13px;opacity:0.5;margin-bottom:16px">Tap a meal to add to the week</p>
    <div class="card" style="margin-bottom:16px">
      <div style="font-weight:800;margin-bottom:10px">🙋 Make a suggestion</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <select id="sugg-by" style="width:100px"><option>Dad</option><option>Mom</option><option>Kid 1</option><option>Kid 2</option></select>
        <input id="sugg-input" placeholder="What do you want?" onkeydown="if(event.key==='Enter')submitSugg()"/>
      </div>
      <button class="btn" style="background:linear-gradient(135deg,#E91E8C,#7B2FBE);color:white;width:100%" onclick="submitSugg()">Submit Suggestion 🚀</button>
    </div>
    <div id="meals-list"></div>
  </div>

  <!-- HISTORY -->
  <div id="history" class="section">
    <h2 style="font-family:'Fredoka One';font-size:22px;margin-bottom:4px">Past Dinners 📖</h2>
    <p style="font-size:13px;opacity:0.5;margin-bottom:16px">Your family's dinner memory</p>
    <div id="history-list"></div>
  </div>

  <!-- SHOPPING -->
  <div id="shopping" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <h2 style="font-family:'Fredoka One';font-size:22px">Shopping 🛒</h2>
      <span id="shop-count" style="font-size:13px;opacity:0.6"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="new-item" placeholder="Add item..." onkeydown="if(event.key==='Enter')addShopItem()"/>
      <button class="btn" style="background:linear-gradient(135deg,#06D6A0,#00C2FF);color:#1a0533;flex-shrink:0;font-size:18px;padding:10px 18px" onclick="addShopItem()">+</button>
    </div>
    <button class="btn" style="background:rgba(255,209,102,0.15);border:1px solid rgba(255,209,102,0.3);color:#FFD166;width:100%;margin-bottom:14px" onclick="autoFill()">✨ Auto-fill from this week</button>
    <div id="shop-list"></div>
  </div>
</div>

<nav class="nav">
  <button class="active" onclick="showSection('planner')"><span class="icon">📅</span>Planner</button>
  <button onclick="showSection('ideas')"><span class="icon">💡</span>Ideas</button>
  <button onclick="showSection('history')"><span class="icon">📖</span>History</button>
  <button onclick="showSection('shopping')"><span class="icon">🛒</span>Shopping</button>
</nav>

<script>
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const COLORS=["#FF6B35","#E91E8C","#00C2FF","#7B2FBE","#FFD166","#06D6A0","#EF476F","#118AB2"];
const MEALS=[
  {n:"Spaghetti Bolognese",e:"🍝",t:"45 min"},{n:"Tacos",e:"🌮",t:"30 min"},
  {n:"Grilled Chicken",e:"🍗",t:"35 min"},{n:"Pizza Night",e:"🍕",t:"25 min"},
  {n:"Stir Fry",e:"🥢",t:"20 min"},{n:"Burgers",e:"🍔",t:"30 min"},
  {n:"Salmon",e:"🐟",t:"25 min"},{n:"Mac & Cheese",e:"🧀",t:"20 min"},
  {n:"BBQ Ribs",e:"🥩",t:"2 hrs"},{n:"Veggie Curry",e:"🍛",t:"40 min"},
  {n:"Hot Dogs",e:"🌭",t:"15 min"},{n:"Fried Rice",e:"🍚",t:"25 min"},
  {n:"Chicken Soup",e:"🍲",t:"1 hr"},{n:"Fish & Chips",e:"🐠",t:"45 min"},
  {n:"Lasagna",e:"🫕",t:"1.5 hrs"},{n:"Poke Bowl",e:"🥗",t:"20 min"},
];
let week={};DAYS.forEach(d=>week[d]=null);
let activeDay=null;
let shopping=[
  {item:"Chicken breast",checked:false},{item:"Pasta",checked:false},
  {item:"Tomatoes",checked:true},{item:"Cheese",checked:false},
];
let pending=[
  {meal:"Burgers",emoji:"🍔",by:"Kid 1",votes:2},
  {meal:"Pizza Night",emoji:"🍕",by:"Kid 2",votes:3},
];
let history=[
  {name:"Tacos",emoji:"🌮",date:"Last Monday",rating:5},
  {name:"Pizza Night",emoji:"🍕",date:"Last Friday",rating:4},
  {name:"Stir Fry",emoji:"🥢",date:"Two weeks ago",rating:3},
];
let suggs=[];

function shuffle(){suggs=[...MEALS].sort(()=>Math.random()-0.5).slice(0,4);}
shuffle();

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach((b,i)=>{
    b.classList.remove('active');
    if(['planner','ideas','history','shopping'][i]===id)b.classList.add('active');
  });
  render();
}

function render(){
  renderWeek();renderMeals();renderHistory();renderShopping();renderPending();
}

function renderWeek(){
  const el=document.getElementById('week-list');
  el.innerHTML=DAYS.map((day,i)=>{
    const meal=week[day];
    const isActive=activeDay===day;
    return`<div class="card" style="cursor:pointer;border:2px solid ${isActive?'#FFD166':'transparent'};${isActive?'box-shadow:0 0 20px rgba(255,209,102,0.3)':''}" onclick="toggleDay('${day}')">
      <div class="day-row">
        <div class="day-label">${SHORT[i]}</div>
        ${meal?`<span style="font-size:26px">${meal.e}</span><div style="flex:1"><div class="meal-name">${meal.n}</div><div class="meal-time">⏱ ${meal.t}</div></div><button class="btn" style="background:rgba(255,255,255,0.1);color:white;padding:6px 12px;font-size:12px" onclick="event.stopPropagation();clearDay('${day}')">✕</button>`
        :`<span style="font-size:22px;opacity:0.4">🤷</span><span style="opacity:0.4;font-style:italic;font-size:14px">Tap to pick dinner</span>`}
      </div>
      ${isActive?`<div class="quick-picks">${suggs.map((s,si)=>`<button class="btn" style="background:${COLORS[si%COLORS.length]}33;border:1px solid ${COLORS[si%COLORS.length]}66;color:white;font-size:12px;padding:7px 12px" onclick="event.stopPropagation();assignMeal(${si})">${s.e} ${s.n}</button>`).join('')}<button class="btn" style="background:rgba(255,255,255,0.1);color:white;font-size:12px;padding:7px 12px" onclick="event.stopPropagation();reshuffle()">🔀 More</button></div>`:''}
    </div>`;
  }).join('');
}

function toggleDay(day){activeDay=activeDay===day?null:day;renderWeek();}
function clearDay(day){week[day]=null;renderWeek();}
function assignMeal(idx){if(!activeDay)return;week[activeDay]=suggs[idx];activeDay=null;renderWeek();}
function reshuffle(){shuffle();renderWeek();}

function renderPending(){
  const sec=document.getElementById('suggestions-section');
  const el=document.getElementById('suggestions-list');
  if(!pending.length){sec.style.display='none';return;}
  sec.style.display='block';
  el.innerHTML=pending.map((s,i)=>`<div class="card" style="display:flex;align-items:center;gap:12px">
    <span style="font-size:26px">${s.emoji}</span>
    <div style="flex:1"><div style="font-weight:800">${s.meal}</div><div style="font-size:12px;opacity:0.5">by ${s.by}</div></div>
    <button class="btn" style="background:rgba(255,107,53,0.3);color:#FF6B35;padding:8px 14px" onclick="upvote(${i})">👍 ${s.votes}</button>
  </div>`).join('');
}

function upvote(i){pending[i].votes++;renderPending();}

function submitSugg(){
  const val=document.getElementById('sugg-input').value.trim();
  const by=document.getElementById('sugg-by').value;
  if(!val)return;
  const m=MEALS.find(x=>x.n.toLowerCase().includes(val.toLowerCase()));
  pending.push({meal:val,emoji:m?.e||'🍽️',by,votes:1});
  document.getElementById('sugg-input').value='';
  renderPending();
}

function renderMeals(){
  document.getElementById('meals-list').innerHTML=MEALS.map((m,i)=>{
    const added=Object.values(week).some(w=>w?.n===m.n);
    return`<div class="card" style="display:flex;align-items:center;gap:14px;cursor:pointer;opacity:${added?0.4:1}" onclick="quickAdd(${i})">
      <span style="font-size:30px">${m.e}</span>
      <div style="flex:1"><div style="font-weight:800;font-size:15px">${m.n}</div><div style="font-size:12px;opacity:0.5;margin-top:3px">⏱ ${m.t}</div></div>
      ${added?`<span style="font-size:12px;opacity:0.5">✓ Added</span>`:`<span style="font-size:20px">➕</span>`}
    </div>`;
  }).join('');
}

function quickAdd(idx){
  const m=MEALS[idx];
  if(Object.values(week).some(w=>w?.n===m.n))return;
  const empty=DAYS.find(d=>!week[d]);
  if(empty){week[empty]=m;renderMeals();renderWeek();}
}

function renderHistory(){
  document.getElementById('history-list').innerHTML=history.map((item,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:14px">
      <div style="width:54px;height:54px;border-radius:14px;background:${COLORS[i%COLORS.length]}33;display:flex;align-items:center;justify-content:center;font-size:28px">${item.emoji}</div>
      <div style="flex:1">
        <div style="font-weight:800;font-size:15px">${item.name}</div>
        <div style="font-size:12px;opacity:0.5">${item.date}</div>
        <div style="margin-top:4px">${[1,2,3,4,5].map(s=>`<span style="color:#FFD166;opacity:${s<=item.rating?1:0.2}">★</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function renderShopping(){
  const done=shopping.filter(i=>i.checked).length;
  document.getElementById('shop-count').textContent=`${done}/${shopping.length} done`;
  document.getElementById('progress-fill').style.width=`${shopping.length?(done/shopping.length)*100:0}%`;
  document.getElementById('shop-list').innerHTML=shopping.map((item,i)=>`
    <div class="card" style="display:flex;align-items:center;gap:14px;cursor:pointer;opacity:${item.checked?0.45:1}" onclick="toggleShop(${i})">
      <div class="check-box ${item.checked?'checked':''}">${item.checked?'✓':''}</div>
      <span style="flex:1;font-size:15px;font-weight:600;text-decoration:${item.checked?'line-through':'none'}">${item.item}</span>
      <button class="btn" style="background:transparent;color:rgba(255,255,255,0.2);padding:4px 8px;font-size:16px" onclick="event.stopPropagation();removeShop(${i})">✕</button>
    </div>`).join('');
}

function toggleShop(i){shopping[i].checked=!shopping[i].checked;renderShopping();}
function removeShop(i){shopping.splice(i,1);renderShopping();}
function addShopItem(){
  const val=document.getElementById('new-item').value.trim();
  if(!val)return;
  shopping.push({item:val,checked:false});
  document.getElementById('new-item').value='';
  renderShopping();
}
function autoFill(){
  Object.values(week).filter(Boolean).forEach(m=>shopping.push({item:`Ingredients for ${m.n}`,checked:false}));
  renderShopping();
}

render();
</script>
</body>
</html>
